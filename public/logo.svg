<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dégradé de fond sombre et élégant -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    
    <!-- Dégradé Bleu/Violet dynamique -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    
    <!-- Dégradé Doré (Inspiration conversion & valeur) -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arrière-plan -->
  <rect width="500" height="500" rx="40" fill="url(#bgGradient)"/>

  <!-- Monogramme Géométrique 'A' -->
  <g transform="translate(150, 90)">
    <path d="M 20 220 L 90 40 L 125 40 L 70 220 Z" fill="url(#accentGradient)" />
    <path d="M 110 40 L 180 220 L 130 220 L 80 80 Z" fill="url(#accentGradient)" opacity="0.85" />
    <path d="M 50 150 L 160 150 L 180 125 L 145 125 L 40 125 Z" fill="url(#goldGradient)" filter="url(#glow)" />
    <circle cx="100" cy="40" r="8" fill="#F59E0B" />
  </g>

  <!-- Typographie -->
  <text x="250" y="380" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">AIMANE</text>
  <text x="250" y="415" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="4">PAGE DE VENTE &amp; EXPERTISE</text>
</svg>
